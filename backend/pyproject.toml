[project]
name = "sat-studypath-backend"
version = "0.1.0"
description = "Personalized SAT study-path generator - API and recommendation engine"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy relationship targets are quoted forward references resolved against
# the mapper registry; the imports themselves stay under TYPE_CHECKING.
"app/models/*.py" = ["UP037"]
